name: Find Matches by Date

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha (YYYY-MM-DD)'
        required: true
        default: '2024-05-20'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Search
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          ISPORTSAPI_KEY: ${{ secrets.ISPORTSAPI_KEY }}
        run: python -m engine.match_finder "${{ github.event.inputs.date }}"
