name: Find Matches by Date

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha (YYYY-MM-DD)'
        required: true
        default: '2024-05-20'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python (allow transient failures)
        uses: actions/setup-python@v4
        continue-on-error: true
        with:
          python-version: '3.9'

      - name: Ensure Python 3.9 is available (fallback installer)
        run: |
          if command -v python3.9 >/dev/null 2>&1; then
            echo "python3.9 already present"
          else
            echo "python3.9 not found, installing via deadsnakes"
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:deadsnakes/ppa
            sudo apt-get update
            sudo apt-get install -y python3.9 python3.9-venv python3.9-distutils
            sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 1 || true
            echo "Python 3.9 installed"
          fi
          python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Run Search
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          ISPORTSAPI_KEY: ${{ secrets.ISPORTSAPI_KEY }}
        run: python3 -m engine.match_finder "${{ github.event.inputs.date }}"
